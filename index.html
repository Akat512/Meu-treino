<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>Meu Treino</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#ffffff;--bg2:#f5f5f3;--bg3:#efefed;
  --text:#1a1a1a;--text2:#6b6b6b;--text3:#a0a0a0;
  --border:rgba(0,0,0,0.11);--border2:rgba(0,0,0,0.2);
  --radius:12px;--radius-sm:8px;
  --mono:'SF Mono','Fira Code',monospace;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#1c1c1e;--text:#f0f0f0;--text2:#8e8e93;--text3:#636366;--border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.22)}
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--text);min-height:100vh;padding-bottom:calc(1rem + env(safe-area-inset-bottom))}
.screen{display:none}.screen.active{display:block}
.container{max-width:480px;margin:0 auto;padding:1.25rem 1rem}
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.btn{border:0.5px solid var(--border2);background:transparent;color:var(--text2);border-radius:var(--radius-sm);padding:9px 14px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:inherit;min-height:44px}
.btn-primary{border:none;color:#fff;font-weight:500}
.btn-back{border:none;background:transparent;color:var(--text2);font-size:14px;cursor:pointer;padding:0 0 1rem;display:flex;align-items:center;gap:4px;font-family:inherit}
input[type=number],input[type=text]{width:100%;font-size:16px;padding:10px 12px;border-radius:var(--radius-sm);border:0.5px solid var(--border2);background:var(--bg);color:var(--text);font-family:inherit;-webkit-appearance:none;appearance:none;outline:none}
input:focus{border-color:var(--border2);box-shadow:0 0 0 3px rgba(0,0,0,0.06)}
.field-label{font-size:11px;color:var(--text2);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem}
.stat-card{background:var(--bg2);border-radius:var(--radius-sm);padding:12px 14px}
.stat-lbl{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.stat-val{font-size:19px;font-weight:500;font-family:var(--mono)}
.day-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;margin-bottom:9px;transition:opacity .15s}
.day-card:active{opacity:.8}
.day-icon{width:42px;height:42px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;letter-spacing:.03em;flex-shrink:0}
.ex-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);margin-bottom:9px;overflow:hidden}
.ex-header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;min-height:56px}
.ex-body{padding:0 16px 14px;border-top:0.5px solid var(--border)}
.sets-wrap{padding:0 16px 10px;display:flex;flex-wrap:wrap;gap:6px}
.set-chip{border-radius:6px;padding:5px 10px;font-size:12px;font-family:var(--mono);font-weight:500;display:flex;align-items:center;gap:6px}
.set-chip .rm{font-size:11px;cursor:pointer;opacity:.6;background:none;border:none;color:inherit;padding:0;line-height:1;min-height:0}
.notes-banner{border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:1rem}
.note-pill{font-size:12px;padding:2px 10px;border-radius:6px;background:rgba(255,255,255,.45)}
.page-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.75rem}
.timer{font-size:32px;font-weight:500;font-family:var(--mono);letter-spacing:.04em;margin:2px 0 0}
.finish-btn{width:100%;padding:16px;border-radius:12px;border:none;font-size:15px;font-weight:500;color:#fff;cursor:pointer;margin-top:1.5rem;margin-bottom:.5rem;font-family:inherit}
.badge{font-size:10px;padding:2px 7px;border-radius:99px;font-weight:500}
h1{font-size:26px;font-weight:500;letter-spacing:-.02em}
h2{font-size:22px;font-weight:500}
.ex-num{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;flex-shrink:0}
.input-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;padding-top:12px}
.add-btn{border:none;border-radius:var(--radius-sm);color:#fff;font-size:20px;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center;align-self:flex-end}
.empty{text-align:center;color:var(--text2);font-size:14px;padding:3rem 1rem}
.htag{font-size:11px;background:var(--bg2);border-radius:6px;padding:3px 8px;color:var(--text2)}
</style>
</head>
<body>

<!-- HOME -->
<div id="s-home" class="screen active">
<div class="container">
  <div class="page-header">
    <div><h1>Meu Treino</h1><p style="font-size:13px;color:var(--text2);margin-top:4px">6 dias · Força & Resistência · Avançado</p></div>
    <button class="btn" onclick="go('history')"><i class="ti ti-history"></i> Histórico</button>
  </div>
  <div id="stats-row" style="display:none" class="stats-grid">
    <div class="stat-card"><div class="stat-lbl">Treinos</div><div class="stat-val" id="st-tot">0</div></div>
    <div class="stat-card"><div class="stat-lbl">Volume</div><div class="stat-val" id="st-vol">0</div></div>
    <div class="stat-card"><div class="stat-lbl">Semana</div><div class="stat-val" id="st-wk">0/6</div></div>
  </div>
  <div id="day-list"></div>
</div>
</div>

<!-- DAY -->
<div id="s-day" class="screen">
<div class="container">
  <button class="btn-back" onclick="go('home')"><i class="ti ti-arrow-left"></i> Voltar</button>
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.5rem">
    <div><h2 id="d-title"></h2><p style="font-size:13px;color:var(--text2);margin-top:4px" id="d-sub"></p></div>
    <button class="btn btn-primary" id="d-start" onclick="startFromDay()"><i class="ti ti-player-play"></i> Iniciar</button>
  </div>
  <div id="d-notes"></div>
  <div id="d-exlist"></div>
</div>
</div>

<!-- WORKOUT -->
<div id="s-workout" class="screen">
<div class="container">
  <div class="card" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
    <div><p style="font-size:13px;color:var(--text2)" id="wk-label"></p><div class="timer" id="wk-timer">00:00</div></div>
    <button class="btn btn-primary" id="wk-fin1" onclick="finish()">Finalizar</button>
  </div>
  <div id="wk-notes"></div>
  <div id="wk-exlist"></div>
  <button class="finish-btn" id="wk-fin2" onclick="finish()">Finalizar Treino</button>
</div>
</div>

<!-- HISTORY -->
<div id="s-history" class="screen">
<div class="container">
  <button class="btn-back" onclick="go('home')"><i class="ti ti-arrow-left"></i> Voltar</button>
  <h2 style="margin-bottom:1.5rem">Histórico de Treinos</h2>
  <div id="hist-list"></div>
</div>
</div>

<!-- PROGRESS -->
<div id="s-progress" class="screen">
<div class="container">
  <button class="btn-back" onclick="go('day')"><i class="ti ti-arrow-left"></i> Voltar</button>
  <h2 id="pr-title" style="margin-bottom:4px"></h2>
  <p style="font-size:13px;color:var(--text2);margin-bottom:1.5rem">Evolução de carga máxima por sessão</p>
  <div id="pr-content"></div>
</div>
</div>

<script>
const W=[
  {id:0,name:"Peito + Ombros + Tríceps",day:"Segunda",c:"#D85A30",bg:"#FAECE7",tc:"#993C1D",
   notes:[],ex:[
    {id:"seg_1",n:"Supino Reto (Barra)",s:5,r:"4–6"},
    {id:"seg_2",n:"Desenv. Militar (Pé)",s:4,r:"6"},
    {id:"seg_3",n:"Supino Inc. (Halter)",s:4,r:"6–8"},
    {id:"seg_4",n:"Paralelas (Dips) c/ peso",s:3,r:"6–8"},
    {id:"seg_5",n:"Tríceps Testa (Barra EZ)",s:3,r:"8"}]},
  {id:1,name:"Costas + Bíceps",day:"Terça",c:"#0F6E56",bg:"#E1F5EE",tc:"#085041",
   notes:[],ex:[
    {id:"ter_1",n:"Levantamento Terra",s:4,r:"5"},
    {id:"ter_2",n:"Barra Fixa (Pull-ups)",s:4,r:"6–8"},
    {id:"ter_3",n:"Remada Curvada (Barra)",s:4,r:"6–8"},
    {id:"ter_4",n:"Face Pull (Polia)",s:3,r:"10"},
    {id:"ter_5",n:"Rosca Direta (Barra)",s:3,r:"8"}]},
  {id:2,name:"Pernas (Pesado)",day:"Quarta",c:"#185FA5",bg:"#E6F1FB",tc:"#0C447C",
   notes:[],ex:[
    {id:"qua_1",n:"Agachamento Livre",s:5,r:"5"},
    {id:"qua_2",n:"Leg Press 45°",s:4,r:"8"},
    {id:"qua_3",n:"Stiff (Barra/Halter)",s:4,r:"6–8"},
    {id:"qua_4",n:"Cadeira Extensora",s:3,r:"10"},
    {id:"qua_5",n:"Panturrilha em Pé",s:4,r:"10"}]},
  {id:3,name:"Peito + Ombros (Leve)",day:"Quinta",c:"#534AB7",bg:"#EEEDFE",tc:"#3C3489",
   notes:["Esteira: 20 min","Prancha: 3×1 min","Abdominal Infra: 3×20"],ex:[
    {id:"qui_1",n:"Supino Inc. Halter",s:4,r:"12–15"},
    {id:"qui_2",n:"Crucifixo Reto",s:3,r:"15"},
    {id:"qui_3",n:"Elevação Lateral",s:4,r:"15–20"},
    {id:"qui_4",n:"Flexão de Braço",s:3,r:"Falha"},
    {id:"qui_5",n:"Tríceps Corda",s:3,r:"15–20"}]},
  {id:4,name:"Costas + Bíceps (Leve)",day:"Sexta",c:"#854F0B",bg:"#FAEEDA",tc:"#633806",
   notes:["Bike HIIT: 15 min"],ex:[
    {id:"sex_1",n:"Puxada Alta (Aberta)",s:4,r:"12–15"},
    {id:"sex_2",n:"Remada Serrote",s:3,r:"12–15"},
    {id:"sex_3",n:"Remada Baixa (Triâng.)",s:3,r:"12–15"},
    {id:"sex_4",n:"Rosca Martelo",s:3,r:"15"},
    {id:"sex_5",n:"Rosca Inversa",s:3,r:"15"}]},
  {id:5,name:"Pernas (Leve)",day:"Sábado",c:"#3B6D11",bg:"#EAF3DE",tc:"#27500A",
   notes:["Cardio leve: 15 min","Abdominal Supra: 3×20","Bicicleta: 3×30"],ex:[
    {id:"sab_1",n:"Avanço (Passada)",s:4,r:"20 passadas"},
    {id:"sab_2",n:"Cadeira Flexora",s:3,r:"15–20"},
    {id:"sab_3",n:"Agachamento Goblet",s:3,r:"15"},
    {id:"sab_4",n:"Panturrilha Sentado",s:4,r:"20"},
    {id:"sab_5",n:"Adutora/Abdutora",s:3,r:"20"}]}
];

let logs={}, aw=null, ti=null, ts=0, cDay=null, openEx=null, cPrEx=null;

function load(){try{const d=localStorage.getItem('gym-v3');if(d)logs=JSON.parse(d);}catch{}}
function save(){try{localStorage.setItem('gym-v3',JSON.stringify(logs));}catch{}}

function fmtT(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;return h>0?`${h}:${p(m)}:${p(sc)}`:`${p(m)}:${p(sc)}`;}
function p(n){return String(n).padStart(2,'0');}
function fmtD(iso){if(!iso)return'';const[,mo,d]=iso.split('-');return`${d}/${mo}`;}
function fmtDFull(iso){try{return new Date(iso+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'});}catch{return iso;}}
function todayIso(){return new Date().toISOString().split('T')[0];}
function todayIdx(){const d=new Date().getDay();return d===0?-1:d-1;}

function lastW(exId){
  const h=Object.entries(logs).filter(([,l])=>l.ex&&l.ex[exId]&&l.ex[exId].length>0).sort(([a],[b])=>b.localeCompare(a));
  if(!h.length)return null;
  return Math.max(...h[0][1].ex[exId].map(s=>s.w||0));
}
function getProgress(exId){
  return Object.entries(logs)
    .filter(([,l])=>l.ex&&l.ex[exId]&&l.ex[exId].length>0)
    .sort(([a],[b])=>a.localeCompare(b))
    .map(([k,l])=>({date:fmtD(k.slice(0,10)),carga:Math.max(...l.ex[exId].map(s=>s.w||0))}));
}
function weekCount(){
  const now=new Date(),mon=new Date(now);
  mon.setDate(now.getDate()-((now.getDay()+6)%7));mon.setHours(0,0,0,0);
  return Object.keys(logs).filter(k=>new Date(k.slice(0,10)+'T12:00:00')>=mon).length;
}
function totalVol(){
  return Object.values(logs).reduce((s,l)=>s+Object.values(l.ex||{}).reduce((ss,sets)=>ss+sets.reduce((sss,x)=>sss+(x.w||0)*(parseInt(x.r)||0),0),0),0);
}

function go(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('s-'+name).classList.add('active');
  window.scrollTo(0,0);
  if(name==='home')renderHome();
  if(name==='history')renderHistory();
}

/* ── HOME ── */
function renderHome(){
  const tot=Object.keys(logs).length;
  const sr=document.getElementById('stats-row');
  if(tot>0){
    sr.style.display='grid';
    document.getElementById('st-tot').textContent=tot;
    const v=totalVol();
    document.getElementById('st-vol').textContent=v>=1000?(v/1000).toFixed(1)+'t':v+'kg';
    document.getElementById('st-wk').textContent=weekCount()+'/6';
  } else sr.style.display='none';

  const ti=todayIdx(),dl=document.getElementById('day-list');
  dl.innerHTML='';
  W.forEach((w,idx)=>{
    const isT=idx===ti;
    const lk=Object.keys(logs).filter(k=>k.endsWith('-'+w.id)).sort().pop();
    const ld=lk?fmtD(lk.slice(0,10)):null;
    const el=document.createElement('div');
    el.className='day-card';
    if(isT)el.style.border=`2px solid ${w.c}`;
    el.onclick=()=>openDay(idx);
    el.innerHTML=`
      <div style="display:flex;align-items:center;gap:13px;flex:1;min-width:0">
        <div class="day-icon" style="background:${w.bg};color:${w.tc}">${w.day.slice(0,3).toUpperCase()}</div>
        <div style="min-width:0">
          <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">
            <span style="font-weight:500;font-size:15px">${w.name}</span>
            ${isT?`<span class="badge" style="background:${w.bg};color:${w.tc}">Hoje</span>`:''}
          </div>
          <p style="font-size:12px;color:var(--text2);margin-top:2px">${w.ex.length} exercícios${ld?' · Último: '+ld:' · Nunca feito'}</p>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
        <button class="btn${isT?' btn-primary':''}" style="${isT?'background:'+w.c+';border:none;color:#fff;font-weight:500':''}"
          onclick="event.stopPropagation();startWorkout(${w.id})">Iniciar</button>
        <i class="ti ti-chevron-right" style="color:var(--text3);font-size:16px"></i>
      </div>`;
    dl.appendChild(el);
  });
}

/* ── DAY ── */
function openDay(idx){
  cDay=idx;
  const w=W[idx];
  document.getElementById('d-title').textContent=w.name;
  document.getElementById('d-sub').textContent=w.day+' · '+w.ex.length+' exercícios';
  document.getElementById('d-start').style.background=w.c;
  document.getElementById('d-notes').innerHTML=notesBanner(w);
  const el=document.getElementById('d-exlist');
  el.innerHTML='';
  w.ex.forEach(ex=>{
    const lw2=lastW(ex.id),prog=getProgress(ex.id);
    const d=document.createElement('div');
    d.className='card';d.style.marginBottom='9px';
    d.innerHTML=`
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <p style="font-weight:500;font-size:14px">${ex.n}</p>
          <p style="font-size:12px;color:var(--text2);margin-top:3px">${ex.s} séries · ${ex.r} reps</p>
        </div>
        <div style="text-align:right;flex-shrink:0;margin-left:12px">
          ${lw2!==null?`<p style="font-size:16px;font-weight:500;font-family:var(--mono);color:${w.c}">${lw2===0?'Peso corpo':lw2+' kg'}</p>`:''}
          ${prog.length>=2?`<button onclick="openProgress('${ex.id}')" style="font-size:11px;color:${w.c};background:transparent;border:none;cursor:pointer;padding:3px 0 0;display:block;font-family:inherit"><i class="ti ti-trending-up"></i> Ver evolução</button>`:''}
        </div>
      </div>`;
    el.appendChild(d);
  });
  go('day');
}
function startFromDay(){startWorkout(W[cDay].id);}

function notesBanner(w){
  if(!w.notes||!w.notes.length)return'';
  return`<div class="notes-banner" style="background:${w.bg}">
    <i class="ti ti-clipboard-list" style="color:${w.c};font-size:15px"></i>
    ${w.notes.map(n=>`<span class="note-pill" style="color:${w.tc}">${n}</span>`).join('')}
  </div>`;
}

/* ── WORKOUT ── */
function startWorkout(dayId){
  const w=W.find(x=>x.id===dayId);
  aw={key:`${todayIso()}-${dayId}`,dayId,ex:{},date:todayIso()};
  ts=0;openEx=null;
  clearInterval(ti);
  ti=setInterval(()=>{ts++;document.getElementById('wk-timer').textContent=fmtT(ts);},1000);
  document.getElementById('wk-label').textContent=w.name+' em andamento';
  document.getElementById('wk-fin1').style.background=w.c;
  document.getElementById('wk-fin2').style.background=w.c;
  document.getElementById('wk-notes').innerHTML=notesBanner(w);
  renderWkEx();
  go('workout');
}

function renderWkEx(){
  const w=W.find(x=>x.id===aw.dayId);
  const el=document.getElementById('wk-exlist');
  el.innerHTML='';
  w.ex.forEach((ex,i)=>{
    const sets=aw.ex[ex.id]||[],done=sets.length>=ex.s,open=openEx===ex.id;
    const lw2=lastW(ex.id),defW=lw2!==null?lw2:0;
    const chips=sets.map((s,si)=>`
      <div class="set-chip" style="background:${w.bg};color:${w.tc}">
        <span>${s.w>0?s.w+'kg':'PC'} × ${s.r}</span>
        <button class="rm" onclick="rmSet('${ex.id}',${si})">✕</button>
      </div>`).join('');
    const form=open?`
      <div class="ex-body">
        <div class="input-row">
          <div><label class="field-label">Carga (kg)</label>
            <input type="number" id="iw-${ex.id}" value="${defW}" min="0" step="2.5" inputmode="decimal"></div>
          <div><label class="field-label">Reps</label>
            <input type="text" id="ir-${ex.id}" placeholder="${ex.r}" onkeydown="if(event.key==='Enter')addSet('${ex.id}')"></div>
          <button class="add-btn" style="background:${w.c}" onclick="addSet('${ex.id}')"><i class="ti ti-plus"></i></button>
        </div>
      </div>`:''
    const card=document.createElement('div');
    card.className='ex-card';
    if(done)card.style.borderColor=w.c;
    card.innerHTML=`
      <div class="ex-header" onclick="togEx('${ex.id}')">
        <div style="display:flex;align-items:center;gap:11px">
          <div class="ex-num" style="background:${done?w.bg:'var(--bg2)'};color:${done?w.tc:'var(--text2)'}">
            ${done?'<i class="ti ti-check" style="font-size:14px"></i>':i+1}</div>
          <div>
            <p style="font-weight:500;font-size:14px">${ex.n}</p>
            <p style="font-size:11px;color:var(--text2);margin-top:2px">${sets.length}/${ex.s} séries · meta: ${ex.r} reps</p>
          </div>
        </div>
        <i class="ti ti-chevron-${open?'up':'down'}" style="color:var(--text3);font-size:16px"></i>
      </div>
      ${sets.length?`<div class="sets-wrap">${chips}</div>`:''}
      ${form}`;
    el.appendChild(card);
  });
}

function togEx(id){
  openEx=openEx===id?null:id;
  renderWkEx();
  if(openEx===id)setTimeout(()=>{const el=document.getElementById('ir-'+id);if(el)el.focus();},80);
}

function addSet(id){
  const wi=document.getElementById('iw-'+id),ri=document.getElementById('ir-'+id);
  if(!ri||!ri.value.trim())return;
  if(!aw.ex[id])aw.ex[id]=[];
  aw.ex[id].push({w:parseFloat(wi?.value)||0,r:ri.value.trim()});
  renderWkEx();
  setTimeout(()=>{const el=document.getElementById('ir-'+id);if(el)el.focus();},80);
}

function rmSet(id,idx){
  if(aw.ex[id]){aw.ex[id].splice(idx,1);renderWkEx();}
}

function finish(){
  clearInterval(ti);
  logs[aw.key]={...aw,duration:ts};
  save();aw=null;ts=0;
  go('home');
}

/* ── HISTORY ── */
function renderHistory(){
  const el=document.getElementById('hist-list');
  const sorted=Object.entries(logs).sort(([a],[b])=>b.localeCompare(a));
  if(!sorted.length){
    el.innerHTML='<div class="empty"><i class="ti ti-barbell" style="font-size:36px;opacity:.3;display:block;margin-bottom:12px"></i>Nenhum treino registrado ainda.</div>';
    return;
  }
  el.innerHTML=sorted.map(([key,log])=>{
    const w=W.find(x=>x.id===log.dayId);if(!w)return'';
    const ts2=Object.values(log.ex||{}).reduce((s,sets)=>s+sets.length,0);
    const vol=Object.values(log.ex||{}).reduce((s,sets)=>s+sets.reduce((ss,x)=>ss+(x.w||0)*(parseInt(x.r)||0),0),0);
    const tags=Object.entries(log.ex||{}).map(([eid,sets])=>{
      const ex=w.ex.find(e=>e.id===eid);if(!ex)return'';
      const mw=Math.max(...sets.map(s=>s.w||0));
      return`<span class="htag">${ex.n}: ${sets.length}× ${mw>0?mw+'kg':'PC'}</span>`;
    }).join('');
    return`<div class="card" style="margin-bottom:9px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div style="display:flex;align-items:center;gap:11px">
          <div class="day-icon" style="width:38px;height:38px;background:${w.bg};color:${w.tc};font-size:10px">${w.name.slice(0,3).toUpperCase()}</div>
          <div>
            <p style="font-weight:500;font-size:14px">${w.name}</p>
            <p style="font-size:12px;color:var(--text2);margin-top:2px">${fmtDFull(log.date)}</p>
          </div>
        </div>
        <div style="text-align:right;flex-shrink:0;margin-left:10px">
          ${log.duration?`<p style="font-size:13px;font-family:var(--mono)">${fmtT(log.duration)}</p>`:''}
          <p style="font-size:11px;color:var(--text3);margin-top:2px">${ts2} séries${vol>0?' · '+vol.toLocaleString()+'kg':''}</p>
        </div>
      </div>
      ${tags?`<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:5px">${tags}</div>`:''}
    </div>`;
  }).join('');
}

/* ── PROGRESS ── */
function openProgress(exId){
  cPrEx=exId;
  let ex=null,w=null;
  for(const wk of W){const f=wk.ex.find(e=>e.id===exId);if(f){ex=f;w=wk;break;}}
  if(!ex||!w)return;
  document.getElementById('pr-title').textContent=ex.n;
  const data=getProgress(exId);
  const el=document.getElementById('pr-content');
  if(data.length<2){
    el.innerHTML=`<div class="card" style="text-align:center;padding:2rem 1rem">
      <i class="ti ti-chart-line" style="font-size:36px;color:var(--text3);display:block;margin-bottom:12px"></i>
      <p style="color:var(--text2);font-size:14px">São necessárias pelo menos 2 sessões para ver o gráfico.</p>
    </div>`;
    go('progress');return;
  }
  const maxL=Math.max(...data.map(d=>d.carga));
  const gain=data[data.length-1].carga-data[0].carga;
  el.innerHTML=`
    <div class="card" style="padding:1rem;margin-bottom:1rem">${svgChart(data,w.c)}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      ${[{l:'Carga máxima (PR)',v:maxL>0?maxL+' kg':'Peso corpo'},
         {l:'Ganho total',v:gain>0?'+'+gain+' kg':gain<0?gain+' kg':'–'},
         {l:'Sessões',v:data.length},
         {l:'Último treino',v:data[data.length-1].date}]
        .map(s=>`<div class="stat-card"><div class="stat-lbl">${s.l}</div>
          <div class="stat-val" style="${s.l==='Ganho total'&&gain>0?'color:'+w.c:''}">${s.v}</div></div>`).join('')}
    </div>`;
  go('progress');
}

function svgChart(data,color){
  const W2=320,H2=160,pL=38,pR=12,pT=12,pB=28;
  const cargas=data.map(d=>d.carga);
  const minC=Math.min(...cargas),maxC=Math.max(...cargas),range=maxC-minC||1;
  const xs=data.map((_,i)=>pL+(i/(data.length-1||1))*(W2-pL-pR));
  const ys=cargas.map(c=>pT+(1-(c-minC)/range)*(H2-pT-pB));
  const path=xs.map((x,i)=>(i===0?'M':'L')+x.toFixed(1)+' '+ys[i].toFixed(1)).join(' ');
  const dots=xs.map((x,i)=>`<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="4.5" fill="${color}"/>`).join('');
  const lbls=data.map((d,i)=>{
    if(data.length>5&&i%2!==0&&i!==data.length-1)return'';
    return`<text x="${xs[i].toFixed(1)}" y="${H2-4}" text-anchor="middle" font-size="10" fill="#888">${d.date}</text>`;
  }).join('');
  const yls=[minC,Math.round((minC+maxC)/2),maxC].map((v,i)=>{
    const y=i===0?H2-pB:i===1?pT+(H2-pT-pB)/2:pT;
    return`<text x="${pL-5}" y="${y+4}" text-anchor="end" font-size="10" fill="#888">${v}</text>`;
  }).join('');
  return`<svg viewBox="0 0 ${W2} ${H2}" width="100%" style="display:block">
    <line x1="${pL}" y1="${pT}" x2="${pL}" y2="${H2-pB}" stroke="#ccc" stroke-width="0.5"/>
    <line x1="${pL}" y1="${H2-pB}" x2="${W2-pR}" y2="${H2-pB}" stroke="#ccc" stroke-width="0.5"/>
    ${yls}${lbls}
    <path d="${path}" stroke="${color}" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
  </svg>`;
}

load();
renderHome();
</script>
</body>
</html>
